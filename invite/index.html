  <script>(() => {
  'use strict';
  // The invite code arrives as ?c=XXXXXXXX (the server's INVITE_URL, and the short link /i/?c=XXXXXXXX) or as
  // /i/#XXXXXXXX. It is the invitation itself, so it is read here, before any other script, and taken out of the
  // address bar: no page view, referrer or history entry carries it. sessionStorage keeps it for a reload of this
  // tab only. /i/ is this same file, so both addresses settle on /invite/.
  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let raw = '';
  try { raw = new URLSearchParams(window.location.search).get('c') || ''; } catch (_) {}
  if (!raw) {
    let hash = String(window.location.hash || '').replace(/^#/, '');
    try { hash = decodeURIComponent(hash); } catch (_) {}
    raw = hash.indexOf('c=') === 0 ? hash.slice(2) : hash;
  }
  if (!raw) { try { raw = window.sessionStorage.getItem('sidekick-invite-code') || ''; } catch (_) {} }
  const code = String(raw).toUpperCase().replace(/[\s-]/g, '');
  const valid = code.length === 8 && Array.from(code).every((ch) => ALPHABET.includes(ch));
  if (window.location.search || window.location.hash) { try { history.replaceState(null, '', '/invite/'); } catch (_) {} }
  if (valid) { try { window.sessionStorage.setItem('sidekick-invite-code', code); } catch (_) {} }
  window.__sidekickInviteCode = valid ? code : null;
})();</script>

  <style>
    /* /login/'s white card and tokens (apps/site/login/index.html); the policy names this block by hash. */
    :root { color-scheme: light; --ink: #1a1d21; --ink-soft: #3f454d; --muted: #6b737d; --bg: #f7f8fa; --card: #ffffff; --sunken: #f0f2f4; --line: #e1e5ea; --hairline: #eceff2; --accent: #b3230a; --shadow: 0 18px 50px rgba(26, 29, 33, 0.08); --radius-md: 14px; --radius-xl: 24px; --control-h-lg: 52px; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", Roboto, sans-serif; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 400px); }
    .card { padding: 14px 14px 22px; border: 1px solid var(--hairline); border-radius: var(--radius-xl); background: var(--card); box-shadow: var(--shadow); text-align: center; }

    .body { padding: 0 10px; }
    h1 { margin: 20px 0 6px; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; }
    .lead { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    .code-box { display: grid; gap: 10px; margin: 0 0 18px; padding: 18px 14px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--sunken); }
    .code-label { margin: 0; color: var(--ink-soft); font-size: 13px; font-weight: 600; }
    .code { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.2; user-select: all; -webkit-user-select: all; }
    .option { display: flex; align-items: center; justify-content: center; width: 100%; min-height: var(--control-h-lg); padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
    .option:hover { border-color: var(--ink-soft); background: var(--bg); }
    .option.primary { border-color: var(--ink); background: var(--ink); color: #ffffff; }
    .option.primary:hover { background: var(--ink-soft); }

<body>
  <main aria-labelledby="invite-title">
    <div class="card">
      <img class="hero" src="/assets/invite/kakao-invite.jpg" width="1000" height="1000" alt="노트북 앞에서 별을 안고 웃는 사이드킥 직원">
      <div class="body">
        <h1 id="invite-title">사이드킥에 초대받았어요</h1>
        <p class="lead">나만의 AI 직원팀, 사이드킥이에요. 아래 초대 코드로 바로 함께 시작할 수 있어요.</p>

        <div id="invite-found">
          <div class="code-box">
            <p class="code-label" id="invite-code-label">초대 코드</p>
            <p class="code" id="invite-code" aria-labelledby="invite-code-label">····-····</p>
          </div>
          <div class="actions">
            <a class="option primary" id="open-app" href="sidekick://invite">앱에서 열기</a>
            <button type="button" class="option" id="copy-code">코드 복사</button>
          </div>
          <p class="status" id="copy-status" role="status" aria-live="polite"></p>
          <p class="note">앱을 설치한 뒤 이 페이지에서 '앱에서 열기'를 누르면 초대 코드가 자동으로 들어가요. 코드를 앱에 직접 입력해도 돼요.</p>
        </div>

        <p class="status is-error" id="invite-missing" role="alert" hidden>초대 코드를 확인할 수 없어요. 받은 링크를 다시 열어 주세요.</p>
        <p class="store">App Store 출시 준비 중</p>
      </div>
    </div>
  </main>
  <script>(() => {
  'use strict';
  const code = window.__sidekickInviteCode;
  const byId = (id) => document.getElementById(id);
  if (!code) {
    byId('invite-found').hidden = true;
    byId('invite-missing').hidden = false;
    return;
  }
  const display = code.slice(0, 4) + '-' + code.slice(4);
  const appLink = 'sidekick://invite?code=' + encodeURIComponent(code);
  byId('invite-code').textContent = display;
  byId('open-app').setAttribute('href', appLink);
  byId('copy-code').addEventListener('click', async () => {
    let copied = false;
    try { await navigator.clipboard.writeText(display); copied = true; } catch (_) {}
    byId('copy-status').textContent = copied ? '코드를 복사했어요.' : '코드를 길게 눌러 복사해 주세요.';
  });
  // One try at opening the installed app with the code, once per tab and code: a reload, or coming back from the
  // App Store, does not try again -- '앱에서 열기' does it on request. No loop and no retrying timer. If the app is
  // not installed nothing else happens: no fingerprint, no clipboard, the page stays as it is.
  let tried = false;
  try { tried = window.sessionStorage.getItem('sidekick-invite-opened') === code; } catch (_) {}
  if (tried) return;
  try { window.sessionStorage.setItem('sidekick-invite-opened', code); } catch (_) {}
  window.setTimeout(() => { window.location.assign(appLink); }, 300);
})();</script>
