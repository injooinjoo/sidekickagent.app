  <script>(() => {
  'use strict';
  const query = new URLSearchParams(window.location.search);
  const fragment = new URLSearchParams(window.location.hash.slice(1));
  const atLogin = window.location.origin === 'https://sidekickagent.app' && window.location.pathname === '/login/';
  let cleared = false;
  // Capture first, then scrub before any external script, request or render.
  try { history.replaceState(null, '', '/login/'); cleared = true; } catch (_) {}
  const proof = /^[A-Za-z0-9_-]{32,128}$/;
  const id = /^[A-Za-z0-9._:-]{1,160}$/;
  const exact = (params, allowed) => Array.from(params.keys()).every((key) =>
    allowed.includes(key) && params.getAll(key).length === 1);
  const result = { invalid: !cleared || !atLogin, mode: 'none', handoff: null, provider: null, web: null };
  if (fragment.size) {
    result.mode = query.has('web_login_attempt') || query.has('web_login_state') ? 'web' : 'app';
    const attempt = fragment.get('app_handoff') || '';
    const state = fragment.get('state') || '';
    const hint = fragment.get('provider') || '';
    if (query.size || !exact(fragment, ['app_handoff', 'state', 'provider'])
        || !id.test(attempt) || !proof.test(state) || (hint && !['google', 'apple'].includes(hint)))
      result.invalid = true;
    else result.handoff = { id: attempt, state, provider: hint };
  } else if (query.size) {
    const web = query.has('web_login_attempt') || query.has('web_login_state');
    result.mode = web ? 'web' : 'app';
    const attempt = query.get(web ? 'web_login_attempt' : 'oauth_attempt') || '';
    const state = query.get(web ? 'web_login_state' : 'oauth_state') || '';
    const code = query.get('code') || '';
    const failed = query.has('error');
    const allowed = [web ? 'web_login_attempt' : 'oauth_attempt', web ? 'web_login_state' : 'oauth_state',
      'code', 'error', 'error_code', 'error_description'];
    if (!exact(query, allowed) || !id.test(attempt) || !proof.test(state)
        || (failed && (query.has('code') || !query.get('error') || query.get('error').length > 160))
        || (!failed && (query.has('error_code') || query.has('error_description')
          || !/^[A-Za-z0-9._~-]{1,2048}$/.test(code)))
        || (query.get('error_code') || '').length > 160
        || (query.get('error_description') || '').length > 1000) result.invalid = true;
    else result[web ? 'web' : 'provider'] = { attempt, state, code, error: failed };
  }
  window.__sidekickLoginInput = result;
})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>시작하기 · Sidekick</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <style>
    /* The tokens are /styles.css's own, repeated here because this page may load no stylesheet
       (its policy names this block by hash). test_login_page.py fails when a value drifts. */
    :root { color-scheme: light; --ink: #1b1a18; --ink-soft: #3d3b37; --muted: #6e6b64; --bg: #faf9f6; --card: #ffffff; --sunken: #f2f0ea; --line: #e7e4dc; --hairline: #efece6; --accent: #b3230a; --shadow: 0 18px 50px rgba(27, 26, 24, 0.07); --radius-md: 12px; --radius-xl: 20px; --control-h-lg: 52px; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 24px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", Roboto, sans-serif; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 400px); min-height: calc(var(--login-visible-height, 100svh) - 48px); margin: auto; display: flex; flex-direction: column; }
    .card { flex: 1; display: flex; flex-direction: column; text-align: left; }
    .card > .brand { display: inline-flex; align-self: flex-start; margin: 18px 0 52px; }
    .brand-mark { width: 32px; height: 32px; flex: none; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; white-space: pre-line; }
    #handoff-status { margin: 0 0 32px; min-height: 1.6em; color: var(--muted); font-size: 15px; }
    #handoff-status[role="alert"] { color: var(--accent); }
    .choices { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    #handoff-phone { margin-top: auto; }
    .options { display: grid; gap: 10px; }
    .account { margin: 0; color: var(--muted); font-size: 14px; }
    .account strong { display: block; color: var(--ink); font-size: 16px; font-weight: 700; }
    .option { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
    .option:hover { border-color: var(--ink-soft); background: var(--bg); }
    .option.primary, .option[data-hint="true"], .option[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #ffffff; }
    .option.primary:hover, .option[data-hint="true"]:hover { background: var(--ink-soft); }
    /* The four brand doors, each in its own guide's colours and all the same size (Kakao #FEE500 with a black
       symbol, Naver #03C75A with a white N, Google white with its G, Apple black with its logo). */
    .option.brand { gap: 10px; }
    .brand-icon { flex: none; width: 18px; height: 18px; }
    .options .option.kakao { border-color: #FEE500; background: #FEE500; color: rgba(0, 0, 0, 0.85); }
    .options .option.kakao:hover { border-color: #F4DC00; background: #F4DC00; }
    .options .option.naver { border-color: #03C75A; background: #03C75A; color: #ffffff; }
    .options .option.naver:hover { border-color: #02B350; background: #02B350; }
    .options .option.google { border-color: #DADCE0; background: #ffffff; color: #1F1F1F; }
    .options .option.google:hover { border-color: #C6C9CE; background: #F8F9FA; }
    .options .option.apple { border-color: #000000; background: #000000; color: #ffffff; }
    .options .option.apple:hover { border-color: #333333; background: #333333; }
    .options .option.brand[data-hint="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
    .options .option:disabled { opacity: 0.6; cursor: default; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 4px 0; color: var(--muted); font-size: 13px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .panel { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    form { display: grid; gap: 12px; margin: 0; }
    #email-form { flex: 1; display: flex; flex-direction: column; }
    label { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
    input { min-width: 0; min-height: 56px; padding: 8px 0; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 24px; width: 100%; }
    input::placeholder { color: var(--muted); opacity: 0.55; }
    .form-row { display: contents; }
    .number-line { display: flex; align-items: center; gap: 12px; }
    #phone-prefix { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 28px; }
    #phone-prefix small { font-size: 14px; color: var(--muted); }
    .number-line input { font-size: 28px; letter-spacing: 0.03em; }
    .number-line input:focus-visible { outline: none; border-bottom-color: var(--ink); }
    .form-row button { min-height: 56px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--ink); color: #ffffff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    #email-form button { margin-top: auto; }
    .form-row button:disabled { opacity: 0.3; cursor: default; }
    .code-entry { position: relative; }
    .code-entry input { position: absolute; inset: 0; height: 100%; opacity: 0; cursor: text; }
    .code-cells { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .code-cells span { display: grid; place-items: center; height: 60px; border-bottom: 2px solid var(--line); font-size: 28px; font-weight: 600; }
    .code-entry:focus-within { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
    .code-entry:focus-within span[data-active="true"] { border-color: var(--ink); }
    .code-entry input:focus-visible { outline: none; }
    .form-status, .note { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 13px; }
    .form-status.is-error, .note.is-error { color: var(--accent); }
    .turnstile-slot { display: flex; justify-content: center; }
    .turnstile-slot:empty { display: none; }
    .quiet { min-height: 44px; padding: 8px 0; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    #login-back { align-self: flex-start; margin: 0 0 16px; }
    .code-actions { display: flex; justify-content: space-between; gap: 16px; }
    dialog { inset: auto 0 0; width: min(100%, 480px); max-height: calc(100svh - 24px); overflow-y: auto; margin: auto auto 0; padding: 24px 24px max(24px, env(safe-area-inset-bottom)); border: 1px solid var(--line); border-radius: 24px 24px 0 0; background: var(--card); color: var(--ink); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .sheet-heading h2 { margin: 0; font-size: 20px; line-height: 28px; }
    #login-methods-close { padding: 8px; }
    .legal { margin: 18px 8px 0; color: var(--muted); font-size: 12.5px; line-height: 1.6; text-align: center; }
    .legal a { color: var(--ink-soft); font-weight: 600; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-height: 620px) { .card > .brand { margin: 0 0 24px; } }
    @media (min-width: 768px) { main { min-height: min(760px, calc(var(--login-visible-height, 100svh) - 48px)); } }
    /* iOS app browsers keep the layout viewport tall when the keyboard opens. */
    :root[data-login-compact] body { min-height: var(--login-visible-height, 100svh); padding: 12px; }
    :root[data-login-compact] main { min-height: 0; height: calc(var(--login-visible-height, 100svh) - 24px); overflow-y: auto; overscroll-behavior: contain; }
    :root[data-login-compact] .card { min-height: 0; }
    :root[data-login-compact] .card > .brand { display: none; }
    :root[data-login-compact] #login-back { min-height: 32px; margin-bottom: 8px; padding: 4px 0; }
    :root[data-login-compact] h1 { margin-bottom: 8px; font-size: 24px; line-height: 30px; }
    :root[data-login-compact] #handoff-status { min-height: 0; margin-bottom: 8px; font-size: 14px; }
    :root[data-login-compact] .choices, :root[data-login-compact] .panel, :root[data-login-compact] #email-form { min-height: 0; gap: 8px; }
    :root[data-login-compact] input, :root[data-login-compact] .form-row button { min-height: 48px; }
    :root[data-login-compact] #email-form button { position: sticky; bottom: 0; }
    :root[data-login-compact] .code-cells span { height: 48px; font-size: 24px; }
    :root[data-login-compact] .legal { margin: 8px 0 0; font-size: 11px; line-height: 1.4; }
    @media (prefers-reduced-motion: reduce) { .option { transition: none; } }
    /* Dark follows the system (issue #3777): /styles.css's dark tokens, ink fills turn light with dark text. */
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --ink: #e0e0e0; --ink-soft: #c8c8c8; --muted: #a0a0a0; --bg: #1a1a1a; --card: #242424; --sunken: #2c2c2c; --line: #3a3a3a; --hairline: #2f2f2f; --accent: #ff7a61; --shadow: 0 0 0 1px var(--line); --on-ink: #121212; } .option.primary, .option[data-hint="true"], .option[aria-pressed="true"], .form-row button { color: #121212; } .options .option.apple { border-color: var(--line); } .brand-mark polygon[fill="#1D1919"] { fill: var(--ink); } }
</style>

      <button type="button" id="handoff-cancel" class="quiet" hidden>취소</button>

    </div>
